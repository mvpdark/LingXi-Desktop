name: Build Windows Desktop

on:
  push:
    branches: [main]
    paths:
      - "lx-clients/**"
      - ".github/workflows/build-native-clients.yml"
  pull_request:
    branches: [main]
    paths:
      - "lx-clients/**"
      - ".github/workflows/build-native-clients.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: lx-clients

jobs:
  build-windows:
    name: Build and Release
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      LX_VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile desktop application
        shell: powershell
        run: .\gradlew.bat :desktopApp:compileKotlinDesktop --stacktrace

      - name: Build MSI
        shell: powershell
        run: .\gradlew.bat :desktopApp:packageReleaseMsi --stacktrace

      - name: Build EXE
        shell: powershell
        run: .\gradlew.bat :desktopApp:packageReleaseExe --stacktrace

      - name: Find built installers
        shell: powershell
        run: |
          Write-Host "=== MSI files ==="
          Get-ChildItem -Path "desktopApp\build\compose\binaries" -Filter "*.msi" -Recurse | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== EXE files ==="
          Get-ChildItem -Path "desktopApp\build\compose\binaries" -Filter "*.exe" -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingxi-windows-msi
          path: lx-clients/desktopApp/build/compose/binaries/main*/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingxi-windows-exe
          path: lx-clients/desktopApp/build/compose/binaries/main*/exe/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v1.0.${{ github.run_number }}"
          Write-Host "Creating release $version..."

          $msiFile = (Get-ChildItem -Path "desktopApp\build\compose\binaries" -Filter "*.msi" -Recurse | Select-Object -First 1).FullName
          $exeFile = (Get-ChildItem -Path "desktopApp\build\compose\binaries" -Filter "*.exe" -Recurse | Select-Object -First 1).FullName

          Write-Host "MSI: $msiFile"
          Write-Host "EXE: $exeFile"

          if (-not $msiFile -or -not $exeFile) {
            Write-Host "ERROR: Could not find installer files!"
            exit 1
          }

          $notesPath = "release_notes.md"
          @"
          Windows desktop application with integrated FFmpeg and AI models.

          ## Downloads
          - MSI installer (recommended for system-wide installation)
          - EXE installer (portable installer)

          ## System Requirements
          - Windows 10/11 (64-bit)
          - Java 17+ (bundled in installer)
          "@ | Set-Content -Path $notesPath -Encoding UTF8

          gh release create $version --title "LingXi Desktop $version" --notes-file $notesPath $msiFile $exeFile

          Write-Host "Release created successfully!"

  build-windows-pr:
    name: Build (PR)
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile desktop application
        shell: powershell
        run: .\gradlew.bat :desktopApp:compileKotlinDesktop --stacktrace

      - name: Build MSI
        shell: powershell
        run: .\gradlew.bat :desktopApp:packageReleaseMsi --stacktrace

      - name: Build EXE
        shell: powershell
        run: .\gradlew.bat :desktopApp:packageReleaseExe --stacktrace
