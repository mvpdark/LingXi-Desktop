name: Build Windows Desktop

on:
  push:
    branches: [main]
    paths:
      - "lx-clients/**"
      - ".github/workflows/build-native-clients.yml"
  pull_request:
    branches: [main]
    paths:
      - "lx-clients/**"
      - ".github/workflows/build-native-clients.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: lx-clients

jobs:
  build-windows:
    name: Build MSI and EXE
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LX_VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile desktop application
        shell: powershell
        run: .\gradlew.bat :desktopApp:compileKotlinDesktop --stacktrace

      - name: Build MSI
        shell: powershell
        run: .\gradlew.bat :desktopApp:packageReleaseMsi --stacktrace

      - name: Build EXE
        shell: powershell
        run: .\gradlew.bat :desktopApp:packageReleaseExe --stacktrace

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: lingxi-windows-msi
          path: lx-clients/desktopApp/build/compose/binaries/main*/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: lingxi-windows-exe
          path: lx-clients/desktopApp/build/compose/binaries/main*/exe/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: lingxi-windows-msi
          path: artifacts

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: lingxi-windows-exe
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LingXi Desktop v1.0.${{ github.run_number }}
          body: |
            ## LingXi Desktop v1.0.${{ github.run_number }}

            Windows desktop application with integrated FFmpeg and AI models.

            ### Downloads
            - **MSI installer** — recommended for system-wide installation
            - **EXE installer** — portable installer

            ### System Requirements
            - Windows 10/11 (64-bit)
            - Java 17+ (bundled in installer)
          files: artifacts/*
          draft: false
          prerelease: false
